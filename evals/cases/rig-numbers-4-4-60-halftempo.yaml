  raw signal was already right, the heuristic broke it. Counts (8) and
  subdivision (none) both correct, isolating the defect to the tempo
  band-normalization step. Strong candidate for a banded-multiplier fix:
  don't double when raw confidence is already high and coverage is
  total, or widen/soften the band's lower edge.
