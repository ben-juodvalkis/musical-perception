  SILENT BEATS (ruling (b)) - owner reports ''lots of skips'', and the arithmetic
  closes exactly. Four gaps, each an integer multiple of the 0.6302 s median IOI:
  1.322 s (2.10x) after 2.634, 1.919 s (3.05x) after 10.021, 1.417 s (2.25x) after
  12.531, 1.204 s (1.91x) after 17.568 - implying 1, 2, 1 and 1 unvoiced beats respectively.
  Estimated silent-beat times: 3.295, 10.660, 11.300, 13.240, 18.170 s. 27 voiced
  + 5 silent = 32 = the case''s counts=32.

  This is the clearest validation of ruling (b) in the corpus: the vocalized-only
  grid holds 27 beats, the metric truth is 32, and the difference is fully recoverable
  from the grid plus the tempo - exactly the claim the convention rests on (''full
  metric grids are derivable later from verified grids + tempo'').

  Tempo: overall IOI CV is 44.1%, entirely the skips. Excluding them, within-phrase
  BPM is 96.07 vs case label 96 (+0.07%) with CV 9.1%. Reinforces the method note
  from rig-names-2-4-120-clean: the IOI-spread check is only meaningful within-phrase.


