notes: 'Owner-verified 2026-08-13 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only, vocalized only. 43 voiced beats, 8.11-37.97 s. Correction vs frozen
  onsets (+/-120 ms): kept 37, deleted 15, added 6; median |nudge| 0.0 ms. Grid-implied
  BPM 90.98 vs case label 90 (+1.09%). Within-phrase IOI CV 9.6%, no short IOIs.

  SILENT BEATS (ruling (b)): three gaps, each ~2.07x the 0.660 s median IOI, after
  14.735 / 22.025 / 30.785 s - one unvoiced beat apiece. Voiced 43 + interior silent
  3 = 46.

  METHOD CAVEAT: gap-based silent-beat detection only sees silence BETWEEN voiced
  beats. Unvoiced beats at the start or end of the marked passage leave no gap to
  measure and are invisible to it. So 46 is a LOWER BOUND on this clip''s metric total,
  not a claim about its structure - 48 (16 bars of 3/4) would require only two more
  silent beats at the edges. Recorded as a bound rather than an assertion; contrast
  rig-names-4-4-96-allegro and rig-names-4-4-63-adagio, where the interior-only count
  landed exactly on 32 and the structure was self-confirming.'
