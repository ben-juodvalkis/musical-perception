notes: 'Owner-verified 2026-08-14 (rung 1.5). FIRST CLIP UNDER RULING (d''): explanation
  speech is eligible and IS marked here - this is a teaching demo where the teacher
  talks in tempo throughout, and the owner marked the pulse through the explanation.
  See docs/evals/annotation-convention.md (d'').

  36 voiced beats, 3.78-34.12 s. Annotated in REAPER against the VIDEO (markers read
  from the .RPP in seconds), not in Audacity - the owner needed to see the demonstration
  to locate accents and counts.

  FROM SCRATCH, not seed-corrected: the peakRate seeds were deleted and all 36 marks
  placed by the owner. Correction stats vs the frozen onsets are therefore unbiased
  by anchoring: kept 35, deleted 66, added 1; median |offset| 32.6 ms.

  ANCHORING / REACTION-LAG FINDING - the most important methodological result of the
  session. The owner''s first pass was tapped live during playback and sat SYSTEMATICALLY
  LATE: median +39.2 ms, mean +34.0 ms vs the nearest peakRate onset, 28 of 33 marks
  later. A refinement pass (scrub and nudge, transport stopped) removed it: median
  -13.5 ms, mean -10.4 ms, 12 later / 23 earlier. For contrast every seed-anchored
  clip in the corpus reads exactly 0.0 ms by construction, because the owner left
  correct-looking seeds untouched. So BOTH methods are biased - live tapping by ~+39
  ms of reaction time, seed correction by anchoring toward peakRate - and the two
  must not be mixed silently: signed asynchrony is a headline stage-1 metric, and
  a 39 ms reference bias is over half the +/-70 ms tolerance. This clip is on the
  refined (scrub-and-nudge) method; the 21 rig clips are seed-anchored.

  Grid-implied BPM: within-phrase 102.27 vs case label 104 (-1.66%); whole-clip 100.45
  (-3.42%), pulled down by the holes. Within-phrase IOI CV 10.5%, no short IOIs.

  THREE KINDS OF HOLE, owner-adjudicated: (i) FREE TIME - a 7.428 s gap after 21.71
  s is an out-of-time demonstration, and the description after the last mark at 34.12
  s (5.3 s to clip end) is also out of time. No metric beats exist in either; they
  must NOT be counted as skipped beats. (ii) SILENT BEATS (ruling (b)) - four gaps
  at ~2x median after 12.70 / 18.35 / 20.64 / 29.14 s, one unvoiced beat each. (iii)
  nothing else. So 36 voiced + 5 silent = 41 metric beats, alongside two free-time
  regions. An earlier automated count of ''16 silent beats'' was wrong precisely because
  it read the free-time demonstration as 12 skipped beats.


  ANNOTATION METHOD (recorded 2026-08-18, owner-confirmed): from_scratch - live tap
  (REAPER, M key) against the video with no marker suggestions shown, followed by
  a scrub-and-nudge correction pass. The annotation_method enum records the cohort;
  this line records the tool and the gesture, which the enum''s frozen two-value vocabulary
  cannot express.'
