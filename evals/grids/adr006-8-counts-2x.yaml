  FLAGGED >4% BPM DISCREPANCY - first of the session, and it is the CASE LABEL that
  is out, not the grid. Grid-implied BPM is 101.63 vs the case''s expect.marking_bpm
  of 130 (-21.83%). The arithmetic is decisive given the verified labels: 16 counts
