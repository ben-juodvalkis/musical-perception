  130 allows - and a ''16 voiced of 20 real beats'' reading is excluded because the
  intervals are uniform with no gaps. The owner, asked to judge by ear, also did not
  hear 130.

  Consequence for scoring: the blessed baseline scores this row tempo=WRONG (predicted
