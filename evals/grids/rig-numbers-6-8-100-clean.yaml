notes: 'Owner-verified 2026-08-13 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only. 24 beats = 4 sets of 6, 2.44-16.27 s.

  TACTUS LEVEL (important for compound meter): the owner counted SIX per bar with
  accents on 1 and 4, so this grid is at the eighth-note/six level, NOT the dotted-quarter
  level. Grid-implied BPM at that level is 99.45 vs case label 100 (-0.55%). A consumer
  that assumes the dotted-quarter beat would expect ~33 BPM here; the grid does not
  encode that level. Recorded so rung-3 meter work reads the reference at the right
  level.

  Correction vs frozen onsets (+/-120 ms): kept 23, deleted 2, added 1; median |nudge|
  0.0 ms, max 56.1 ms. IOI 0.514-0.682 s, CV 7.1%, every interval within 0.85-1.13x
  median, no short IOIs, no gaps.

  QC note: the owner first judged the seed correct as-is. The seed checks disagreed
  - two labels sat 234 ms and 123 ms after their neighbours (0.39x and 0.21x median)
  and a 1.169 s gap (1.97x) implied a missing beat near 4.93 s. On re-listening the
  owner deleted 2.678 and 5.935, added a beat at 4.926, and nudged one label 56 ms,
  yielding 25 - 2 + 1 = 24 = the 4 sets of 6 they had described. Second time this
  session that the short-IOI and IOI-spread checks caught what a pass-through would
  have missed.'
