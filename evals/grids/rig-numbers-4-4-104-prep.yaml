notes: 'Owner-verified 2026-08-12 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only; ruling (c) puts the in-tempo prep IN the grid. 20 beats = prep ''five
  six seven eight'' + 1-8 twice, 2.37-13.31 s, matching the 20 transcript tokens exactly.
  Correction vs frozen onsets (time-matched): kept 20, deleted 6, added 0; median
  |nudge| 0.0 ms - peakRate found every true beat and the owner moved nothing. Grid-implied
  BPM 105.08 vs case label 104 (+1.04%) - within the 4% check. IOI 0.518-0.650 s,
  CV 6.8%, no phrase-boundary gaps.

  Contract note: the case sheet expects counts=8, deliberately treating the prep as
  outside the phrase. That is the counts contract; this grid is the beat contract.
  Prep beats are in the grid AND outside the counted phrase - no contradiction.

  All 6 deletions are within-word extra events, in two distinct modes. (a) Second
  syllable of ''seven'': +174.3 / +133.7 / +120.7 ms - the mode the owner identified
  on rig-numbers-4-4-104-clean, now 6 instances across two clips at a consistent +120
  to +175 ms. (b) NEW - diphthong/coda re-fire on MONOSYLLABLES: ''five'' (+207.8,
  +353.8 ms) and ''eight'' (+143.1 ms), both /aI/ or /eI/ with a stop or fricative
  coda. Lexical stress is not the whole story; the detector re-fires on the glide
  or the release.

  Distribution finding: 4 of the 6 extras fall in the 4-beat prep (100% false-positive
  rate) vs 2 across the 16 body beats. Emphatic tempo-setting delivery is what the
  envelope-derivative detector over-reads, so ruling (c) means rung 2 is scored on
  the hardest beats in the clip rather than skipping them.


