  SHARPENS A HISTORICAL DIAGNOSIS: the case notes describe ADR-007''s output here
  (82.7, duple) as the ''/2-over-/3 normalization defect''. Against verified truth,
  82.7 is not a metric-level relative of 68.38 at all - the family {1/3,1/2,1,2,3}
  x 68.38 is {22.8, 34.2, 68.4, 136.8, 205.1} and 82.7 falls in none of those bins.
  The historical failure was OFF-FAMILY, not a level confusion. Recorded, not acted
  on; evals/cases is untouchable this rung and pinning marking_bpm here is an owner
  decision that would change tier-1 scoring for this row.

