  FIRST GROUND-TRUTH TEMPO FOR THIS CASE: 68.38 BPM at the tactus. The case''s expect
  block carries no marking_bpm and its notes say ''deliberately unpinned: the ADRs
  never established the true beat rate''. It is now established. The syllable-level
