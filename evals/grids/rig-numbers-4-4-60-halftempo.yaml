notes: 'Owner-verified 2026-08-12 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only. 16 beats = 2 rounds of 8 at a 1.0 s beat period, 8.03-23.01 s. Correction
  vs frozen onsets (+/-120 ms): kept 16, deleted 8, added 0; median |nudge| 0.0 ms.
  Grid-implied BPM 60.19 vs case label 60 (+0.32%). IOI 0.907-1.091 s, CV 4.5% - the
  tightest pulse measured in the corpus so far.

  FINDING (parked) - Whisper BLOCK PHASE SLIP at slow tempo. Token count matches the
  grid exactly (16:16), so nothing is dropped here, but the per-beat offsets are bimodal
  rather than noisy: beats 5-9 and 12-16 land within -32 to +145 ms, while beats 2,3,4
  are -694 / -751 / -792 ms and beats 10,11 are -734 / -750 ms. Those runs keep the
  CORRECT ~1.06 s internal spacing but are shifted bodily early by about 0.75 s -
  three quarters of a beat - then re-sync (at beat 5, and again at beat 12). Whisper
  is not drifting; it intermittently locks a run of words onto the wrong beat and
  recovers. Summary: median -11.9 ms but mean -219.9 ms, sd 361.3 ms, only 7/16 within
  +/-70 ms and 11/16 within +/-250 ms. Consequence for scoring: a tolerance-based
  F on this clip reads as a detection failure when the real defect is phase, and the
  median asynchrony statistic hides it entirely - relevant to how the rung-2 gate
  is expressed (annotation-convention.md section 2).


