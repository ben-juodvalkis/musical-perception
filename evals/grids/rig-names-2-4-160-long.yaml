notes: 'Owner-verified 2026-08-13 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only, vocalized only. 54 voiced beats, 3.06-25.57 s. Fastest clip in the
  corpus: 160 BPM, 0.375 s beat period. Correction vs frozen onsets (+/-120 ms): kept
  44, deleted 3, added 10 - the only clip where the owner ADDED more beats than peakRate
  got wrong, because at this tempo the detector''s 120 ms minimum peak spacing is
  a third of a beat period and it simply cannot resolve them all. median |nudge| 0.0
  ms. Grid-implied BPM 159.76 vs case label 160 (-0.15%). Within-phrase IOI CV 9.7%.

  SILENT BEATS (ruling (b)): 7 gaps, each ~2x median, after 5.341 / 8.333 / 11.325
  / 14.315 / 17.283 / 18.847 / 20.294 s. The first four are spaced ~2.99 s apart =
  8 beats, i.e. one unvoiced beat at the end of each 8-count. 54 voiced + 7 interior
  silent = 61 against the case''s counts=64; the remaining 3 are most likely at the
  edges, where gap-based detection is blind (see rig-names-3-4-90-clean notes).

  QC: the owner''s first export carried a leftover within-word extra at ~23.364 s,
  121 ms after the beat at 23.243 s - caught by the short-IOI check and removed on
  re-listening. Removing it also moved the BPM check from +1.30% to -0.15%. Fourth
  such catch this session.


  ANNOTATION METHOD (recorded 2026-08-18, owner-confirmed): anchored - correction
  of pre-existing peakRate marker suggestions in Audacity (delete non-beats, nudge
  survivors to vowel onsets, add missed beats). The annotation_method enum records
  the cohort; this line records the tool and the gesture, which the enum''s frozen
  two-value vocabulary cannot express.

  BPM DEFINITIONS (owner-directed, 2026-08-24 batch review): the figure above -
  grid-implied BPM 159.76 - is the whole-clip median including the seven unvoiced
  gaps, computed before region tags existed. Post-tagging, with tagged gaps
  excluded from the median, the same grid computes 164.07 (vs case label 160 =
  +2.5%, within the 4% check). Both are correct under their definitions; the
  2026-08-18 tagging changed the default computation (see that ledger entry).'
