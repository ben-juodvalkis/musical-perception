notes: 'Owner-verified 2026-08-13 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only; ruling (d) applied without exception to the explanation. 26 beats,
  2.42-21.99 s. Correction vs frozen onsets (+/-120 ms): kept 24, deleted 17, added
  2; median |nudge| 0.0 ms. Grid-implied BPM 103.81 vs case label 104 (-0.19%); within-phrase
  IOI CV 7.1%.

  TWO GAPS, TWO DIFFERENT MEANINGS - and the file cannot tell them apart. (1) After
  8.180 s, a 5.217 s gap (9.03x median): the explanation (''now make sure when you
  tendu that you''re really lengthening from the floor''), excluded under ruling (d).
  No beats exist there - the pulse was not being marked. 15 of the 17 deletions fall
  inside it. (2) After 17.378 s, a 1.138 s gap (1.97x): ONE unvoiced beat at approximately
  17.95 s, where the pulse continued but nothing was said - a ruling (b) silent beat.

  Both appear in `beats` as holes in a flat list of times, and the distinction is
  unrecoverable from the file. This is the C6 no-tagging limitation (annotation-convention.md
  section 3) in a new form: a consumer cannot separate ''no beat existed here'' from
  ''a beat existed and was silent''. Only these notes carry it, which matters for
  any later attempt to reconstruct full metric grids.

  OWNER RULING 2026-08-14: re-checked by ear after the (d'') amendment. The pulse
  was NOT voiced through the excised explanation window (8.180-13.397 s), so zero
  beats there is correct under (d'') as well as under v1. No re-annotation needed.'
