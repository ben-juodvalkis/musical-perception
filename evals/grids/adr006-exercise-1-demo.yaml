notes: 'Owner-verified 2026-08-14 (rung 1.5), under ruling (d''). 41 voiced beats,
  4.77-39.44 s of a 60.1 s clip. Annotated in REAPER against the video, from scratch,
  plus a scrub-and-nudge pass.

  WALTZ, SPARSE ARTICULATION: 3/4 at a label of 117 BPM. The owner voices only two
  of the three beats per bar, so most bars contribute two marks and one silent beat
  (ruling (b)). Interval durations are cleanly bimodal - 19 at ~0.533 s and 19 at
  ~0.949 s. Beat period estimated by pooling the 1-beat cluster with half the 2-beat
  cluster: 0.5067 s -> 118.42 BPM vs case label 117 (+1.21%), within the 4% check.
  NOTE the plain median IOI is NOT the beat period on this clip and would mislead
  (0.896 s); any future consumer must cluster first.

  OPEN OBSERVATION: the owner reports articulating beats 1 and 3, but the cluster
  ratio is 1.78 rather than the 2.00 that 1-and-3 implies. A ratio near 1.78 fits
  ''1 and 2 with a lengthened downbeat'' - and exactly that agogic accent was measured
  on rig-names-3-4-88-waltz (beat 1->2 running +9.9% vs the bar mean). Unresolved;
  recorded rather than assumed.

  METHOD: the first pass showed the live-tap reaction lag (median +33.2 ms vs peakRate,
  23 of 32 later). After the nudge pass: median -2.7 ms, 18 later / 21 earlier. Cohort
  now aligned - grande battement -13.5, frappe -18.8, this clip -2.7 - so the three
  video grids are mutually comparable. Correction vs frozen onsets: kept 39, deleted
  97, added 2.

  FREE TIME (no metric beats): the final 20.6 s, from 39.44 s to the end, is the teacher
  speeding through a demonstration OUT of time (owner-confirmed) - a third of the
  clip, and it must not be counted as skipped beats. The first 4.77 s is likewise
  unmarked. One interior gap of 3.392 s (~6.7 beats) around 16.0 s is left unclassified
  between silent-pulse and free time.

  Silent-beat arithmetic over the marked span: 41 voiced + 19 silent (from the 2-beat
  gaps) = 60 metric beats.


  ANNOTATION METHOD (recorded 2026-08-18, owner-confirmed): from_scratch - live tap
  (REAPER, M key) against the video with no marker suggestions shown, followed by
  a scrub-and-nudge correction pass. The annotation_method enum records the cohort;
  this line records the tool and the gesture, which the enum''s frozen two-value vocabulary
  cannot express.'
