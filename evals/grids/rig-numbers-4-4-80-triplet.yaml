notes: 'Owner-verified 2026-08-12 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only, so the numbers and none of the ''and-a'' triplet syllables. 16 beats
  = 2 rounds of 8, 3.06-14.26 s. Correction vs frozen onsets (time-matched, +/-120
  ms): kept 16, deleted 15, added 0; median |nudge| 0.0 ms. Grid-implied BPM 80.62
  vs case label 80 (+0.78%). IOI 0.684-0.820 s, CV 5.2%, no short IOIs, no gaps.

  Cleanest correction in the session so far: peakRate found every one of the 16 tactus
  beats, placed each exactly, and all 15 of its errors are genuine subdivision syllables
  that ruling (a) excludes - i.e. on this clip the detector made no timing error and
  no miss, only level-selection errors.

  Whisper alignment vs verified truth (nearest token start to each beat): 14/16 beats
  align to the number rather than a subdivision syllable; median signed offset -35.4
  ms (early), median |offset| 43.0 ms. Direction matches Standing Lesson 1. This is
  the first words-vs-truth asynchrony measured on a triplet clip against verified
  ground truth rather than peakRate suggestions. Whisper emits all 48 syllable tokens
  here (2 x 8 x 3), so on dense triplet counting the ASR channel is complete and reasonably
  aligned - contrast rig-numbers-4-4-104-clean, where it silently dropped a whole
  round of eight.


