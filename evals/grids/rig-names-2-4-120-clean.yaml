  SILENT BEATS (ruling (b)) - first grid in the corpus to carry them. Two phrase breaks,
  owner-confirmed by ear: a ~2-beat gap before the beat at 6.087 s (silent beat around
  5.60 s) and another before 10.112 s (silent beat around 9.60 s). Both fall exactly
  at the transcript''s phrase boundaries. The pulse continued; nothing was voiced;
  so no labels, per the vocalized-only ruling. Recorded here so a later taggable-format
  rung can reconstruct the full metric grid.

  METHOD NOTE: overall IOI CV is 25.6%, but that is entirely the two legitimate phrase
  breaks. Within-phrase (24 intervals, breaks excluded) the range is 0.452-0.578 s
  and CV is 6.4% - squarely in the corpus norm. The IOI-spread check must be computed
  within-phrase or every clip containing a rest reads as a broken grid; same principle
  as Standing Lesson 5, where boundary intervals are censored rather than averaged
  in.

  QC: the owner''s first export carried one leftover within-word extra at 13.233 s,
  129 ms after the beat at 13.104 s - the same re-fire mode as the ''seven''/''five''/''eight''
