  the 4% check. IOI 0.493-0.623 s, CV 5.4%.

  Owner observation: peakRate placed a spurious label on the SECOND syllable of ''seven''
  in every round - the only three deletions, at +133.0 / +137.1 / +127.7 ms after
  the true beat. ''seven'' is the only two-syllable number in the count and the detector
  has no lexical-stress model.

  FINDING (parked, not acted on - Standing Lesson 8): the trace''s whisper.json holds
  16 words = two rounds; this grid holds 24 voiced beats = three. Whisper dropped
  the entire middle round (6.99-10.99 s) on a clean high-SNR clip; gemini.json classified
  the 16 survivors as two tidy rounds of eight. The case scores green on tempo/meter/counts
  anyway (counts-per-phrase is 8 either way; the 5.2 s inter-round gap is rejected
  as an outlier), so a third of the recording is invisible to the pipeline behind
  a green row. Both the owner''s ear and the voiced-gated peakRate detector independently
  place 8 beats across the dropped span.


