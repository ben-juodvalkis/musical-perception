notes: 'Owner-verified 2026-08-13 (rung 1.5). Convention: docs/evals/annotation-convention.md
  - tactus only, vocalized only. 26 voiced beats, 3.94-33.50 s. Correction vs frozen
  onsets (+/-120 ms): kept 18, deleted 31, added 8; median |nudge| 0.0 ms. Grid-implied
  BPM 61.39 vs case label 63 (-2.56%) - within the 4% check. Within-phrase IOI CV
  15.0% (adagio rubato).

  PERIODIC SILENT BEATS (ruling (b)). Six gaps, each ~2x the 0.977 s median IOI, after
  5.655 / 9.821 / 13.264 / 17.236 / 21.090 / 24.923 s - spaced about 3.9 s apart,
  i.e. roughly every 4 beats. One unvoiced beat per gap, at approximately 6.734, 10.638,
  14.337, 18.124, 22.122 and 25.765 s. The owner speaks three beats and holds the
  fourth, consistently. 26 voiced + 6 silent = 32 = 4 rounds of 8, which is independent
  confirmation that the reading is correct - an arbitrary set of missed labels would
  not total a round number.

  peakRate''s second-worst clip: 49 events offered for 26 true beats, 31 of them not
  beats, and 8 real beats missed entirely (recall 69%, precision 37%). This is the
  widest word-vs-syllable gap in the corpus - Whisper produced only 19 word tokens
  here while peakRate fired 49 times - and it is what continuous adagio prose at 63
  BPM does to a syllable-rate detector: syllables outnumber beats several times over
  and nothing in the envelope distinguishes them.


  ANNOTATION METHOD (recorded 2026-08-18, owner-confirmed): anchored - correction
