pre_roll:
  # Asked before anything was opened, knowing only what the filename shows:
  # a frappé demo, 8th section of a barre class.
  verbatim:
    - >-
      fast and sharp. the meter could be duple or triplet equally. usually
      wouldn't be in groupings of 3 or 6 pulses but it could be. I'd assume
      it wouldn't be too long, and would maybe have 8 counts in betwee. it
      would be light a sharp and quick
    - "maybe 100-120bpm."   # elicited by a follow-up prompt (see deviations)
