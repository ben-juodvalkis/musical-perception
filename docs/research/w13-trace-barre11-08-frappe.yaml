    tempo_bpm_range: [100, 120]
    character: "fast, sharp, light, quick"
    division_prior: "duple or triplet — explicitly equal, uncommitted"
    grouping_prior: "usually NOT 3- or 6-pulse groupings, but possible"
    phrase_prior: 'not too long; "maybe 8 counts in betwee[n]"'

pass_1:
