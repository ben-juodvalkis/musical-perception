  enough_at:
    verbatim: "i could start playing within 10 seconds."
    parsed_s: 10   # "within 10 seconds" of clip time
  would_play:
    verbatim: "120bpm. 6/4. sharp and light. 8 sets of 6 followed by a balance"
    parsed:
      tempo_bpm: 120
      meter: "6/4"
      character: "sharp and light"
      structure: "8 sets of 6, followed by a balance"
  still_unsure:
    verbatim: >-
      at the end, i could have wondered whether there would be a balance, or
      whether we go straight to the left without stopping, or if we pause
      and restart on the left
    parsed: "ending only: balance vs straight-to-left vs pause-and-restart"
  prior_deltas:
    - "6/4 commitment overrides the pre-roll grouping prior (usually not 3/6)"
    - "120bpm sits at the top edge of the stated 100-120 prior range"
    - '"8 sets" echoes the pre-roll "maybe 8 counts" phrase-shape prior'

pass_2:
  marks:
    - id: 1
      t_s: 3            # owner-stated; playhead poll read 4.17s
      span: point
      observation: >-
        Teacher speaks a line announcing a six-count lead-in to the exercise
        (paraphrased per A5-30; the line names the step). This lands BEFORE
        any demonstration movement at all.
      owner_verbatim:
        - "at 3 seconds he says [six counts into the exercise — paraphrased]"
        - "it's nefore any demonstration at all"
        - "the exercise type and the meter. it was just audio. not much was discarded"
      inference: "exercise type + the meter, settled from one spoken line"
      discarded: "not much"
      modality: heard
    - id: 2
      t_s: 6            # owner-stated span start; playhead poll read 5.71s
      span: "from ~6s, resolved within 6 counts (owner: sure by then)"
      observation: >-
        Demonstration begins. Tempo arrives, the meter decision is
        reinforced, and the quality arrives — carried by counting voice and
        movement together, "both fused."
      owner_verbatim:
        - >-
          starting at 6 seconds i get the tempo, reinforce the meter
          decision, and get the quality, from both visual and audio. after 6
          counts i'm  sure of everything besides form
        - "both fused."
        - "form is the structure."
        - >-
          i discard the actual name of each step, more just getting the
          quality and rhythm
      inference: "tempo; meter reinforcement; quality. Sure of everything except structure after 6 counts."
      discarded: "the actual name of each step (keeps quality and rhythm, drops lexis)"
      modality: heard+saw (fused)
    - id: 3
      t_s: 30           # owner-stated span 30-33s; playhead poll read 33.57s
      span: "30-33s"
      observation: >-
        End of the exercise. The teacher BREAKS RHYTHM — stops keeping time —
        and speaks a line announcing the balance (paraphrased per A5-30; the
        owner's own report was already an approximation, not a quote).
      owner_verbatim:
        - >-
          30-33 seconds is the end of the exercise so i learn how long it
          is, and that we balance instead of go right to the other side
        - >-
          both. i discarded the actual individual steps. i knew it was over
          because he broke rhtyhm and said something like [announcing the
          balance — paraphrased] and he wasn't keeping rhtyhm anymore
      inference: >-
        Total length; ending = balance (not straight to the other side) —
        resolves the pass-1 end-uncertainty. End detected by rhythm-break
        plus announcement.
      discarded: "the actual individual steps"
      modality: heard+saw

  negative_space:
    verbatim: >-
      basically once i got the tempo and the fact that it was in 6, i almost
