reading_the_fields:
  counts: "how many counted numbers the section runs \u2014 the length an accompanist must play"
  count_unit: what ONE count spans. 3/4 exercises count the BAR; 4/4 count the BEAT. Verified 10/10 against
    clip duration. Without it, counts is ambiguous by 3x.
  music_seconds: "counts x count_unit at bpm \u2014 the derived length, checked against clip_seconds"
  demo rows: describe the exercise the teacher STATES; the demo clip itself is shorter because marking
    is abbreviated. music_seconds > clip_seconds is expected here.
  role: demo | take | balance/portdebras tails are separate clips with their own tempo
single_tempo_ruling: 'Owner, 2026-09-01: multiple tempi inside one exercise overcomplicate the model at
  this stage. The developpe was removed entirely (accelerando 80->100 inside a take, no single true tempo).
  The tendu''s balance and both rond-de-jambe port-de-bras sections were removed as cases because they
  run at a different tempo from the exercise they follow. Every surviving case holds ONE steady tempo.
  The tails are documented here and nowhere else: five of ten exercises had one, so a class-music model
  that assumes one tempo per exercise is wrong about half of them.'
