reading_the_fields:
  counts: TOTAL COUNTS, and a count is always ONE BEAT (owner framing 2026-09-01). counts = counts_per_bar
    x bars_per_phrase x phrases.
  worked_example: 'plie: 3 counts per bar x 8 bars per phrase x 8 phrases = 192 counts. tendu: 4/4, 8
    counts per phrase x 8 phrases = 64 counts.'
  why_no_count_unit: An earlier version stored counts sometimes as bars and sometimes as beats, and needed
    a count_unit tag to disambiguate. The owner's framing has ONE meaning of count, so the tag was removed
    along with the ambiguity it existed to describe.
  demo rows: describe the exercise the teacher STATES; the demo clip is shorter because marking is abbreviated,
    so music_seconds > clip_seconds is expected there.
  counts_per_phrase: A phrase is 8 dance-counts. In 4/4 the dancer counts the BEAT, so a phrase is 8 counts
    (2 bars). In 3/4 the dancer counts the BAR, so a phrase is 24 counts (8 bars). counts / counts_per_phrase
    = phrases, and every row divides exactly.
  why_not_counts_per_bar_or_bars_per_phrase: "counts_per_bar is the meter's numerator \u2014 storing it\
    \ repeats `meter`. bars_per_phrase is derivable from counts and phrases, and storing it caused a real\
    \ error: hardcoded to 8, it made the 8-phrase tendu come out as 2. counts + phrases is the minimal\
    \ complete pair."
single_tempo_ruling: 'Owner, 2026-09-01: multiple tempi inside one exercise overcomplicate the model at
  this stage. The developpe was removed entirely (accelerando 80->100 inside a take, no single true tempo).
  The tendu''s balance and both rond-de-jambe port-de-bras sections were removed as cases because they
  run at a different tempo from the exercise they follow. Every surviving case holds ONE steady tempo.
  The tails are documented here and nowhere else: five of ten exercises had one, so a class-music model
  that assumes one tempo per exercise is wrong about half of them.'
count_unit_rule: "3/4 exercises count the BAR, 4/4 count the BEAT \u2014 10/10 in this class, derived\
  \ from clip duration on TAKE rows only. Demo rows take the rule, not the measurement: a demo clip is\
  \ shorter than the exercise it describes, so fitting counts to demo clip length gives the wrong unit\
  \ (it did, once, on tendu-warmup-demo)."
